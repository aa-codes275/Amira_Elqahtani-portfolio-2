<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QR — أميرة القحطاني</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<style>
  body{background:linear-gradient(140deg,var(--burgundy-deep),var(--burgundy));color:#fff;min-height:100svh}
  .qr-wrap{max-width:1000px;margin:0 auto;padding:60px 22px;text-align:center}
  .qr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:20px;margin-top:36px}
  .qr-card{background:#fff;color:var(--ink);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
  .qr-card h3{font-size:1rem;margin:0 0 12px;color:var(--burgundy)}
  .qr-card img{margin:0 auto;border-radius:10px;background:#fff}
  .qr-card a{display:inline-block;margin-top:10px;font-size:.8rem;color:var(--burgundy-soft);word-break:break-all}
  .maker{margin-top:44px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:18px;padding:24px;max-width:520px;margin-inline:auto}
  .maker input{width:100%;padding:12px;border-radius:12px;border:0;font-family:inherit;margin:12px 0;text-align:center}
  #customQr{margin:14px auto 0;background:#fff;padding:10px;border-radius:12px;display:none}
</style>
</head>
<body>
<div class="qr-wrap">
  <p class="kicker" style="color:var(--sky)">QR CODES</p>
  <h2>امسح وتعرّف على أعمالي</h2>
  <p style="opacity:.85">أكواد سريعة لجميع مواقع ومشاريع أميرة القحطاني.</p>

  <div class="qr-grid" id="grid"></div>

  <div class="maker">
    <h3 style="margin:0">مولّد QR لأي رابط</h3>
    <input id="url" placeholder="https://..." />
    <button class="btn btn-primary" id="gen">توليد</button>
    <img id="customQr" alt="QR" width="220" height="220" />
  </div>

  <p class="tiny" style="color:var(--sky);margin-top:34px"><a href="index.html">← رجوع للبورتفوليو</a></p>
</div>

<script>
const SITES = [
  { name: "البورتفوليو الرسمي", url: "https://amira-al-qahtani.vercel.app/" },
  { name: "مكتب الخدمات العامة", url: "https://aa-codes275.github.io/your-_Services/" },
  { name: "Amira Luxury Parfums", url: "https://aa-codes275.github.io/Amira_-luxury-_parfums/" },
  { name: "Gardenia", url: "https://aa-codes275.github.io/gardenia_portfolio/" },
];
const api = u => "https://api.qrserver.com/v1/create-qr-code/?size=260x260&margin=8&data=" + encodeURIComponent(u);
document.getElementById("grid").innerHTML = SITES.map(s => `
  <div class="qr-card">
    <h3>${s.name}</h3>
    <img src="${api(s.url)}" alt="QR ${s.name}" width="200" height="200" loading="lazy" />
    <a href="${s.url}" target="_blank" rel="noopener">${s.url}</a>
  </div>`).join("");

document.getElementById("gen").onclick = () => {
  const v = document.getElementById("url").value.trim();
  if (!v) return;
  const img = document.getElementById("customQr");
  img.src = api(v); img.style.display = "block";
};
</script>
</body>
</html>
